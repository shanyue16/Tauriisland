[package]
name = "tauriisland"
version = "26.10.1206"
description = "A Dynamic Island for Windows"
authors = ["you"]
edition = "2021"

[lib]
name = "tauriisland_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-http = "2"
# 发送系统通知（toast）。未打包桌面应用可以直接发，不需要 MSIX 包标识。
# ⚠️ desktop 端只用到 title / body / icon / sound —— 官方文档明确
#    "scheduling, grouping and action related options are ignored"，
#    所以不要指望用 Schedule 做定时通知（见 docs/notifications-plan.md §3.7）。
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# 系统通知读取 — 解析 %LOCALAPPDATA%\Microsoft\Windows\Notifications\wpndatabase.db
# ⚠️ bundled 必须开：系统不自带 sqlite3.dll，走系统库会运行时缺 DLL。
# ⚠️ 该库被 WPN 服务以 WAL 模式长期占用，且实测 WAL(2.1MB) 比主库(1MB) 还大，
#    只读主库会丢掉绝大多数最新通知 → 必须把 .db/-wal/-shm 三个文件一起复制
#    到临时目录再打开副本（详见 docs/notifications-plan.md §2.2）。
rusqlite = { version = "0.40", features = ["bundled"] }
# Windows SMTC — 直接调用 WinRT GlobalSystemMediaTransportControlsSessionManager
# ⚠️ Foundation_Collections 必须开：GetSessions()（全量枚举会话）被
#    #[cfg(feature = "Foundation_Collections")] 门控，缺失时会报
#    "no method named GetSessions"。网易云不是系统 "current session"，
#    只靠 GetCurrentSession 会读不到。
windows = { version = "0.58", features = [
  "Media_Control",
  "Media",
  "Foundation",
  "Foundation_Collections",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_Com",
  # 全屏隐藏：SHQueryUserNotificationState 在 Win32::UI::Shell 下，
  # 没有这个 feature 会报 "could not find Shell in UI"（同 Foundation_Collections 那类门控）。
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  # 全局快捷键：RegisterHotKey/UnregisterHotKey/MOD_* 在 Win32::UI::Input::KeyboardAndMouse 下
  # （不是 WindowsAndMessaging），缺这个 feature 会报 unresolved import。
  "Win32_UI_Input_KeyboardAndMouse",
  "implement",
] }

# 发布构建：剥离符号。
#
# ⚠️ 实测结论（2026-10-11，v26.10.11-1 打包）：**在 MSVC 工具链上这一项对 exe 体积几乎无用**。
#    设置后 exe 仍是 17.62 MiB，且二进制里**依然存在** CodeView(RSDS) 调试目录项，
#    内容指向旁边的 `tauriisland.pdb`（10.21 MiB）。
#    原因：MSVC 从来不把调试信息嵌进 exe，它一直写在独立的 .pdb 里，
#    exe 内只有一个约几十字节的指针。所以"strip 掉就能让 exe 小一大截"在 MSVC 上不成立
#    （那是 GNU/ELF 的行为）。
#    保留它的理由：对 ELF/其它目标有效、对 MSVC 无害；**不要**把它当成已生效的瘦身手段。
#    真要压 exe 体积，可用的杠杆是 `lto = true` + `codegen-units = 1` + `opt-level = "s"`，
#    代价是构建时间从 ~3.5 分钟涨到十几分钟，且 `panic = "abort"` 会改掉 panic 行为
#    （本应用是常驻托盘程序，panic 行为变更需单独评估）。属另一件事，未做。
#
# 另注：`tauriisland.pdb` 与整个 `target/` 都是构建中间产物，**不进安装包**；
# 发布只需上传 bundle/nsis 下的那一个 -setup.exe（本次 4.52 MiB）。
[profile.release]
strip = true
